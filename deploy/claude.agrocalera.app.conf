# Certbot agrega HTTPS después de comprobar el DNS.
server {
    listen 80;
    listen [::]:80;
    server_name claude.agrocalera.app;
    root /var/www/claude/current;
    index index.html;
    autoindex off;

    auth_basic "AgroCalera - Taller Claude";
    auth_basic_user_file /etc/nginx/claude.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        default_type text/plain;
        try_files /healthz =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
